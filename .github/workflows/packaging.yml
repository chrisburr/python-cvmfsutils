name: Packaging

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build-packages:
    name: Build source and binary distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for setuptools-scm

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install setuptools-scm
      run: pip install setuptools-scm

    - name: Generate RPM spec file
      run: python generate_spec.py

    - name: Get version from spec
      id: version
      run: |
        VERSION=$(grep "^Version:" rpm/python-cvmfsutils.spec | awk '{print $2}')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build source and binary distributions
      uses: hynek/build-and-inspect-python-package@v2
      env:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}

  rpm-build:
    name: Build RPM package - AlmaLinux ${{ matrix.alma-version }}
    runs-on: ubuntu-latest
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        alma-version: ["8", "9", "10"]
    container:
      image: almalinux:${{ matrix.alma-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      timeout-minutes: 10
      run: |
        dnf update -y
        dnf install -y git rpm-build rpm-devel python3-pip python3-devel python3-setuptools
        dnf install -y python3-requests python3-dateutil python3-cryptography

        # Enable PowerTools/CRB for additional packages
        if [ "${{ matrix.alma-version }}" = "8" ]; then
          dnf config-manager --set-enabled powertools || true
        else
          dnf config-manager --set-enabled crb || true
          dnf install -y python3-pyproject-rpm-macros || true
        fi

        # No build tools needed - installing from pre-built source distribution

    - name: Download source distribution
      uses: actions/download-artifact@v4
      with:
        name: Packages
        path: dist/

    - name: Build RPM from spec file
      run: |
        # Extract version from spec file
        VERSION=$(grep "^Version:" rpm/python-cvmfsutils.spec | awk '{print $2}')
        echo "Building version: $VERSION"

        # Setup RPM build tree
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

        # Copy source tarball to SOURCES (renamed to match spec version)
        cp "dist/cvmfsutils-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/

        # Copy spec file to SPECS (now includes version, no macros needed)
        cp rpm/python-cvmfsutils.spec ~/rpmbuild/SPECS/

        # Build the RPM (no version macro needed since it's in the spec file)
        rpmbuild -ba ~/rpmbuild/SPECS/python-cvmfsutils.spec

        # Copy built RPMs back to dist/
        cp ~/rpmbuild/RPMS/noarch/*.rpm dist/
        cp ~/rpmbuild/SRPMS/*.rpm dist/

    - name: List generated files
      run: |
        ls -la dist/
        find dist/ -name "*.rpm" -exec file {} \;

    - name: Test RPM installation and catdirusage command
      run: |
        # Verify catdirusage doesn't exist before installation
        echo "=== Checking catdirusage is not installed ==="
        if command -v catdirusage &> /dev/null; then
          echo "ERROR: catdirusage already exists before RPM installation!"
          exit 1
        else
          echo "✓ catdirusage not found (as expected)"
        fi

        # Install the RPM
        echo "=== Installing RPM ==="
        rpm -ivh dist/python-cvmfsutils-*.noarch.rpm

        # Verify catdirusage exists after installation
        echo "=== Checking catdirusage is installed ==="
        if command -v catdirusage &> /dev/null; then
          echo "✓ catdirusage found at: $(command -v catdirusage)"
        else
          echo "ERROR: catdirusage not found after RPM installation!"
          exit 1
        fi

        # Test the actual command
        echo "=== Testing catdirusage command ==="
        catdirusage http://cvmfs-stratum-one.cern.ch/cvmfs/lhcb-condb.cern.ch / || {
          echo "Note: Command may fail due to network restrictions in CI, but binary exists"
        }

        # Show RPM info
        echo "=== RPM package info ==="
        rpm -qi python-cvmfsutils

    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages-alma${{ matrix.alma-version }}
        path: |
          dist/*.rpm

  suse-rpm-build:
    name: Build RPM package - openSUSE ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Leap 15.5"
            image: "opensuse/leap:15.5"
            artifact: "leap-15.5"
          - name: "Leap 15.6"
            image: "opensuse/leap:15.6"
            artifact: "leap-15.6"
          - name: "Tumbleweed"
            image: "opensuse/tumbleweed"
            artifact: "tumbleweed"
    container:
      image: ${{ matrix.image }}

    steps:
    - name: Install system dependencies
      timeout-minutes: 10
      run: |
        zypper refresh
        zypper install -y tar gzip git rpm-build python3-pip python3-devel python3-setuptools
        zypper install -y python3-requests python3-dateutil python3-cryptography

    - uses: actions/checkout@v4

    - name: Download source distribution
      uses: actions/download-artifact@v4
      with:
        name: Packages
        path: dist/

    - name: Build RPM from spec file (SUSE)
      run: |
        # Extract version from spec file
        VERSION=$(grep "^Version:" rpm/python-cvmfsutils.spec | awk '{print $2}')
        echo "Building version: $VERSION"

        # Setup RPM build tree
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

        # Copy source tarball to SOURCES (renamed to match spec version)
        cp "dist/cvmfsutils-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/

        # Copy spec file to SPECS (already has version embedded)
        cp rpm/python-cvmfsutils.spec ~/rpmbuild/SPECS/

        # Build the RPM (set topdir since SUSE defaults to /usr/src/packages)
        rpmbuild -ba --define "_topdir $HOME/rpmbuild" ~/rpmbuild/SPECS/python-cvmfsutils.spec

        # Copy built RPMs back to dist/
        cp ~/rpmbuild/RPMS/noarch/*.rpm dist/
        cp ~/rpmbuild/SRPMS/*.rpm dist/

    - name: Test RPM installation (SUSE)
      run: |
        # Install the RPM
        echo "=== Installing RPM ==="
        rpm -ivh dist/python-cvmfsutils-*.noarch.rpm

        # Verify catdirusage exists after installation
        echo "=== Checking catdirusage is installed ==="
        if command -v catdirusage &> /dev/null; then
          echo "✓ catdirusage found at: $(command -v catdirusage)"
        else
          echo "ERROR: catdirusage not found after RPM installation!"
          exit 1
        fi

        # Show RPM info
        echo "=== RPM package info ==="
        rpm -qi python-cvmfsutils

    - name: Upload SUSE RPM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpm-packages-suse-${{ matrix.artifact }}
        path: |
          dist/*.rpm

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-packages
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        name: Packages
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
