name: CI

on:
  push:
    branches: [ devel, "feature/*", "fix/*", "refactor/*", "ci-demo-fixed" ]
  pull_request:
    branches: [ devel ]
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]  # macos-13=Intel, macos-14=ARM
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for setuptools-scm
        
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.8.1
      with:
        cache: false
        environments: testing
        
    - name: Run tests
      run: pixi run test

